<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      padding: 16px;
      background: #f6f8fa;
      color: #24292f;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .header img { width: 28px; height: 28px; }
    .header h1 { font-size: 15px; font-weight: 600; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 8px;
    }
    .row label { font-size: 13px; cursor: pointer; user-select: none; }
    .switch {
      position: relative; width: 40px; height: 22px; flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; background: #b0b0b0; border-radius: 22px;
      cursor: pointer; transition: .25s;
    }
    .slider::before {
      content: ""; position: absolute; width: 16px; height: 16px;
      left: 3px; bottom: 3px; background: #fff; border-radius: 50%;
      transition: .25s;
    }
    .switch input:checked + .slider { background: #2da44e; }
    .switch input:checked + .slider::before { transform: translateX(18px); }

    /* 引擎列表 */
    .engine-title {
      font-size: 12px; font-weight: 600; color: #57606a;
      margin: 12px 0 6px; display: flex; justify-content: space-between; align-items: center;
    }
    .engine-title button {
      font-size: 11px; padding: 2px 8px; border: 1px solid #d0d7de; border-radius: 6px;
      background: #f6f8fa; color: #57606a; cursor: pointer; font-weight: 400; margin-left: 4px;
    }
    .engine-title button:hover { background: #eaeef2; }
    .engine-list {
      background: #fff; border: 1px solid #d0d7de; border-radius: 8px; overflow: hidden;
    }
    .engine-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; font-size: 12px; border-bottom: 1px solid #eaeef2;
    }
    .engine-item:last-child { border-bottom: none; }
    .engine-item .idx {
      width: 16px; text-align: center; color: #8b949e; font-size: 11px; flex-shrink: 0;
    }
    .engine-item .name { flex: 1; }
    .engine-item .state { font-size: 10px; padding: 1px 6px; border-radius: 10px; flex-shrink: 0; }
    .state-ok { background: #dafbe1; color: #1a7f37; }
    .state-cool { background: #fff8c5; color: #9a6700; }
    .state-dead { background: #ffebe9; color: #cf222e; }
    .engine-item .moves { display: flex; flex-direction: column; gap: 1px; flex-shrink: 0; }
    .engine-item .moves button {
      width: 18px; height: 13px; line-height: 11px; font-size: 9px; padding: 0;
      border: 1px solid #d0d7de; background: #f6f8fa; border-radius: 3px;
      cursor: pointer; color: #57606a;
    }
    .engine-item .moves button:hover { background: #eaeef2; }
    .engine-item .moves button:disabled { opacity: .3; cursor: default; }
    .tip { font-size: 11px; color: #6e7781; margin-top: 6px; line-height: 1.5; }

    .btn {
      font-size: 12px; padding: 3px 10px; border: 1px solid #d0d7de; border-radius: 6px;
      background: #f6f8fa; cursor: pointer;
    }
    .btn:hover { background: #eaeef2; }
    .footer {
      font-size: 11px; color: #6e7781; text-align: center;
      margin-top: 6px; padding-top: 8px; border-top: 1px solid #d0d7de;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="logo">
    <h1>GitHub 中文化</h1>
  </div>

  <div class="row">
    <label for="toggle">启用翻译</label>
    <label class="switch">
      <input type="checkbox" id="toggle" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div class="row">
    <label for="translate-title">翻译页面标题</label>
    <label class="switch">
      <input type="checkbox" id="translate-title" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div class="row">
    <label for="mt-toggle">人机翻译（长文对照）</label>
    <label class="switch">
      <input type="checkbox" id="mt-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="engine-title">
    <span>翻译引擎优先级</span>
    <span>
      <button id="eng-probe" title="重新检测各引擎网络可达性">重测</button>
      <button id="eng-reset">默认</button>
    </span>
  </div>
  <div class="engine-list" id="eng-list"></div>
  <div class="tip">按顺序尝试，失败自动回退。不可达引擎会自动沉底（30 分钟后再试），右上「重测」可立即重新检测。</div>

  <div class="row" style="margin-top:10px">
    <label for="mt-clear" style="color:#cf222e">清除译文缓存</label>
    <button id="mt-clear" class="btn">清除</button>
  </div>
  <div class="tip" id="mt-clear-tip" style="min-height:14px"></div>
  <div class="footer">刷新页面后生效 · 词条离线 · 长文点「译」按钮</div>
  <script src="popup.js"></script>
</body>
</html>
